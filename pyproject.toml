[project]
name = "translate-vk-bot"
version = "0.1.0"
description = "VK-бот-переводчик с историей и запоминанием языковых пар"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "vkbottle==4.11.0",
    "SQLAlchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    "aiohttp>=3.14.3,<4.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "python-dotenv==1.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]